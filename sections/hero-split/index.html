<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Split — X Designs</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<style>
  html,body{margin:0}
  body{background:var(--xd-bg);color:var(--xd-ink);font-family:var(--xd-font);-webkit-font-smoothing:antialiased}
</style>
</head>
<body>

<!-- XD:START section=hero-split -->
<style>
  .xd-hero-split{
    padding:var(--xd-pad-section) var(--xd-gutter);
    background:var(--xd-bg);
    color:var(--xd-ink);
    font-family:var(--xd-font);
    overflow:hidden;
  }
  .xd-hero-split .xd-wrap{
    max-width:var(--xd-max);
    margin:0 auto;
    display:grid;
    grid-template-columns:1.05fr .95fr;
    gap:56px;
    align-items:center;
  }
  .xd-hero-split .xd-eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin:0 0 20px;
    padding:6px 12px 6px 8px;
    border:1px solid var(--xd-line);
    border-radius:999px;
    background:var(--xd-surface);
    box-shadow:var(--xd-shadow);
    font-size:13px;
    font-weight:550;
    color:var(--xd-ink-soft);
  }
  .xd-hero-split .xd-dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--xd-ok);
    box-shadow:0 0 0 3px color-mix(in srgb, var(--xd-ok) 22%, transparent);
  }
  .xd-hero-split h1{
    margin:0 0 18px;
    font-family:var(--xd-font-display);
    font-size:clamp(34px,5vw,58px);
    line-height:1.04;
    letter-spacing:-.03em;
    font-weight:680;
  }
  .xd-hero-split .xd-lede{
    margin:0 0 32px;
    max-width:46ch;
    color:var(--xd-ink-soft);
    font-size:clamp(16px,1.3vw,19px);
    line-height:1.6;
  }
  .xd-hero-split .xd-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .xd-hero-split .xd-btn{
    display:inline-flex;align-items:center;justify-content:center;
    height:48px;padding:0 22px;
    border-radius:999px;
    border:1px solid transparent;
    font-size:15px;font-weight:600;
    text-decoration:none;
    transition:transform .35s var(--xd-ease), opacity .35s var(--xd-ease);
  }
  .xd-hero-split .xd-btn:hover{transform:translateY(-1px)}
  .xd-hero-split .xd-btn-primary{background:var(--xd-accent);color:var(--xd-accent-ink)}
  .xd-hero-split .xd-btn-ghost{
    background:var(--xd-surface);
    color:var(--xd-ink);
    border-color:var(--xd-line);
    box-shadow:var(--xd-shadow);
  }
  .xd-hero-split .xd-note{margin:20px 0 0;font-size:13px;color:var(--xd-ink-soft)}

  /* right column: a neutral panel to drop a screenshot or mock into */
  .xd-hero-split .xd-panel{
    position:relative;
    border:1px solid var(--xd-line);
    border-radius:var(--xd-radius);
    background:var(--xd-surface);
    box-shadow:var(--xd-shadow);
    aspect-ratio:4/3;
    overflow:hidden;
  }
  .xd-hero-split .xd-panel::after{
    content:"";
    position:absolute;inset:0;
    background:
      radial-gradient(120% 80% at 80% 0%, color-mix(in srgb, var(--xd-accent) 14%, transparent), transparent 60%),
      linear-gradient(transparent 0 0);
  }
  .xd-hero-split .xd-panel img{display:block;width:100%;height:100%;object-fit:cover}

  @media (max-width:900px){
    .xd-hero-split .xd-wrap{grid-template-columns:1fr;gap:36px}
    .xd-hero-split .xd-lede{max-width:none}
  }
  @media (prefers-reduced-motion:reduce){
    .xd-hero-split .xd-btn{transition:none}
    .xd-hero-split .xd-btn:hover{transform:none}
  }
</style>

<section class="xd-hero-split" aria-labelledby="xd-hero-split-title">
  <div class="xd-wrap">
    <div class="xd-col">
      <p class="xd-eyebrow"><span class="xd-dot" aria-hidden="true"></span> Now in open beta</p>
      <h1 id="xd-hero-split-title">A headline that says exactly what this does</h1>
      <p class="xd-lede">
        Two lines of supporting copy that name the audience and the outcome.
        Concrete beats clever — say what changes for them.
      </p>
      <div class="xd-actions">
        <a class="xd-btn xd-btn-primary" href="#">Get started</a>
        <a class="xd-btn xd-btn-ghost" href="#">See how it works</a>
      </div>
      <p class="xd-note">No card required · Cancel anytime</p>
    </div>
    <div class="xd-panel">
      <!-- Swap for a real screenshot: <img src="assets/preview.png" alt="..."> -->
    </div>
  </div>
</section>
<!-- XD:END section=hero-split -->

</body>
</html>
